# SoftGPU: on GNU/Linux, replace rustc's anonymous cdylib version script with
# crates/softgpu-hsa/hsa-runtime64.version (see link-cdylib.sh). Without this,
# passing a second --version-script makes GNU ld fail.
[target.x86_64-unknown-linux-gnu]
linker = "crates/softgpu-hsa/link-cdylib.sh"

[target.aarch64-unknown-linux-gnu]
linker = "crates/softgpu-hsa/link-cdylib.sh"
