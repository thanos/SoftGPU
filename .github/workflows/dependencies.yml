name: Dependencies

on:
  push:
  pull_request:
  schedule:
    # Catch new RustSec advisories even without code changes.
    - cron: "17 9 * * 1"

concurrency:
  group: softgpu-deps-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup show

      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features
