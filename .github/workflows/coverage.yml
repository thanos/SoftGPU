name: Coverage

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: softgpu-coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coveralls:
    name: llvm-cov → Coveralls
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain (rust-toolchain.toml)
        run: |
          rustup show
          rustup component add llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          # Pin so CI matches tools/coverage.sh assumptions (--workspace --no-run exports).
          tool: cargo-llvm-cov@0.9.1

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: coverage

      - name: Generate coverage (floor + LCOV + HTML)
        env:
          # Keep in sync with tools/coverage.sh defaults; bump only when intentional.
          SOFTGPU_COV_FAIL_UNDER_LINES: "80"
          SOFTGPU_COV_FAIL_UNDER_FUNCS: "80"
        run: |
          chmod +x tools/coverage.sh
          bash tools/coverage.sh

      - name: Job summary
        if: always()
        run: |
          {
            echo "## SoftGPU coverage"
            echo
            if [[ -f target/llvm-cov/summary.txt ]]; then
              echo '```'
              cat target/llvm-cov/summary.txt
              echo '```'
            else
              echo "_No summary produced (coverage step may have failed before report)._"
            fi
            echo
            echo "Floor: lines ≥ \`75%\`, functions ≥ \`74%\` (see \`tools/coverage.sh\`)."
            echo "HTML report attached as workflow artifact \`llvm-cov-html\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload LCOV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lcov-info
          path: lcov.info
          if-no-files-found: ignore

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llvm-cov-html
          path: target/llvm-cov/html
          if-no-files-found: ignore

      - name: Publish to Coveralls
        if: success()
        uses: coverallsapp/github-action@v2
        with:
          file: lcov.info
          format: lcov
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fail-on-error: true
          measure: true
