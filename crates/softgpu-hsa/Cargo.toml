[package]
name = "softgpu-hsa"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "SoftGPU ROCr/HSA compatibility adapter (cdylib)"
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["gpu", "hsa", "rocr", "hip", "rocm"]
categories = ["development-tools", "emulators", "api-bindings"]

[lib]
# Cargo forbids hyphens in lib names. Build emits libhsa_runtime64.{so,dylib};
# deployment/CI should symlink or rename to libhsa-runtime64.* for ROCr substitution.
name = "hsa_runtime64"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
softgpu-core = { workspace = true }

[build-dependencies]
cc = "1.0"

[dev-dependencies]
